version: '3.8'

services:
  selenium:
    image: selenium/standalone-chrome:latest
    ports:
      - "4444:4444"
    environment:
      - DISPLAY=:99
      - SE_VNC_NO_LISTEN=1
    shm_size: 2gb

  tutorialninja:
    build: .
    depends_on:
      - selenium
    environment:
      - SELENIUM_HUB_URL=http://selenium:4444
      - SELENIUM_GRID_HOST=selenium
      - SELENIUM_GRID_PORT=4444
    volumes:
      - ./target/reports:/app/target/htmlreports
